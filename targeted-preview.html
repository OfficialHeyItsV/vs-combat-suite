<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V's Combat Suite — targeted menu fixture</title>
  <link rel="stylesheet" href="styles/targeted.css">
  <style>
    :root { color-scheme: dark; --color-border-light-2: #70818b; --color-border-highlight: #63d2c8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 2rem; background: #1b242b; color: #e9f0f2; font: 14px system-ui, sans-serif; }
    .application.dialog { width: 1080px; max-width: 100%; margin: 0 auto; padding: 0; background: #2c3941; border: 1px solid #70818b; border-radius: 8px; box-shadow: 0 1rem 3rem #0008; }
    .dialog-header { padding: .8rem 1rem; border-bottom: 1px solid #70818b; font-weight: 700; }
    .dialog-content.standard-form { display: flex; flex-direction: column; gap: 1rem; padding: 1rem; }
    .standard-form .form-group { display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: .5rem; }
    .standard-form .form-group > * { flex: 2; }
    .standard-form .form-group > label { flex: 1; font-weight: 700; }
    select { color: inherit; background: #182126; border: 1px solid #70818b; border-radius: 4px; padding: .4rem; }
    .form-footer { display: flex; gap: .5rem; padding: 0 1rem 1rem; }
    .form-footer button { flex: 1; padding: .5rem; }
    .tsa-dialog > p:first-child { margin-top: 0; }
  </style>
<link rel="stylesheet" href="styles/suite.css"></head>
<body class="game">
  <form class="dialog-form standard-form application dialog">
    <div class="dialog-header">Targeted Attack</div>
    <div class="dialog-content standard-form">
      <div class="tsa-dialog">
        <p><strong>V's Fighter</strong> — choose an attack and target location.</p>
        <div class="form-group tsa-attack-group">
          <label>Attack</label>
          <select name="attackIndex">
            <option value="0">Longsword — Slash (+5)</option>
            <option value="1">Shortbow — Shoot (+7)</option>
            <option value="2">Handaxe (+4)</option>
          </select>
        </div>
        <div class="tsa-grid"><label class="tsa-location"><input type="radio" name="location" value="eyes" >
      <span class="tsa-location-content"><strong>Eyes</strong><small>Attack -6 · Damage ×(1d3+1)</small><span class="tsa-effects"><span class="tsa-effect"><b>Hit</b><span>Target is Bloodied for 1 turn.</span></span><span class="tsa-effect"><b>Bloodied</b><span>Disadvantage on Wisdom (Perception) checks that rely on sight and on ranged attack rolls. If all eyes are crippled, the creature is Blinded.</span></span><span class="tsa-effect"><b>Critical</b><span>Disadvantage on Wisdom (Perception) checks that rely on sight and on ranged attack rolls. If all eyes are lost, the creature is permanently Blinded.</span></span></span></span>
    </label><label class="tsa-location"><input type="radio" name="location" value="head" >
      <span class="tsa-location-content"><strong>Head</strong><small>Attack -6 · Damage ×(1d2+1)</small><span class="tsa-effects"><span class="tsa-effect"><b>Hit</b><span>Disadvantage on rolls for 1 turn.</span></span><span class="tsa-effect"><b>Bloodied</b><span>At the start of each turn, make a DC 16 Constitution saving throw. On a failure, the creature can take only one action, one bonus action, or one movement that turn.</span></span><span class="tsa-effect"><b>Critical</b><span>The creature dies if it cannot live without its head.</span></span></span></span>
    </label><label class="tsa-location"><input type="radio" name="location" value="arm" >
      <span class="tsa-location-content"><strong>Arm</strong><small>Attack -3 · Damage ×(1d2)</small><span class="tsa-effects"><span class="tsa-effect"><b>Hit</b><span>Disadvantage on attacks for 1 turn.</span></span><span class="tsa-effect"><b>Bloodied</b><span>The creature takes 2d4 damage if it uses the crippled arm.</span></span><span class="tsa-effect"><b>Critical</b><span>The creature can no longer hold anything with two hands and can only hold a single object at a time.</span></span></span></span>
    </label><label class="tsa-location"><input type="radio" name="location" value="object" >
      <span class="tsa-location-content"><strong>Object</strong><small>Attack -3 · 0 damage</small><span class="tsa-effects"><span class="tsa-effect"><b>Hit</b><span>No extra effect.</span></span><span class="tsa-effect"><b>Bloodied</b><span>The object is launched (1d6 × 5) feet away.</span></span><span class="tsa-effect"><b>Critical</b><span>The object is destroyed if it can be destroyed.</span></span></span></span>
    </label><label class="tsa-location"><input type="radio" name="location" value="torso" >
      <span class="tsa-location-content"><strong>Torso</strong><small>Attack -1 · Normal damage</small><span class="tsa-effects"><span class="tsa-effect"><b>Hit</b><span>No extra effect.</span></span><span class="tsa-effect"><b>Bloodied</b><span>The creature takes 1d4−1 damage each time it makes an action.</span></span><span class="tsa-effect"><b>Critical</b><span>The creature takes 1d10 damage at the end of its turn until fully healed, and takes 1d4−1 damage each time it makes an action.</span></span></span></span>
    </label><label class="tsa-location"><input type="radio" name="location" value="groin" >
      <span class="tsa-location-content"><strong>Groin</strong><small>Attack -3 · Damage ×(1d3)</small><span class="tsa-effects"><span class="tsa-effect"><b>Hit</b><span>No extra effect.</span></span><span class="tsa-effect"><b>Bloodied</b><span>The creature can only take one action, one bonus action, or one movement this turn.</span></span><span class="tsa-effect"><b>Critical</b><span>The creature takes 1d10 damage at the end of its turn until fully healed and becomes Paralyzed for 1d4 rounds.</span></span></span></span>
    </label><label class="tsa-location"><input type="radio" name="location" value="leg" >
      <span class="tsa-location-content"><strong>Leg</strong><small>Attack -3 · Damage ×(1d2)</small><span class="tsa-effects"><span class="tsa-effect"><b>Hit</b><span>The creature's movement speed is reduced by half for 1 turn.</span></span><span class="tsa-effect"><b>Bloodied</b><span>The creature takes 1d4 damage for every 10 feet it moves.</span></span><span class="tsa-effect"><b>Critical</b><span>Walking speed is halved. The creature has disadvantage on Dexterity checks and saves made to balance, must use a cane or crutch to move, and falls Prone if it takes the Dash action.</span></span></span></span>
    </label><label class="tsa-location"><input type="radio" name="location" value="standard" checked>
      <span class="tsa-location-content"><strong>Standard</strong><small>Attack +0 · Normal damage</small><span class="tsa-effects"><span class="tsa-effect"><b>Hit</b><span>No extra effect.</span></span><span class="tsa-effect"><b>Bloodied</b><span>No extra effect.</span></span><span class="tsa-effect"><b>Critical</b><span>Normal critical damage; no extra effect.</span></span></span></span>
    </label></div>
        <p class="notes"><i class="fa-solid fa-circle-info"></i> Targeted locations insert their accuracy penalty into the native D&amp;D5e attack roll. Standard uses the unmodified native attack formula.</p>
      </div>
    </div>
    <footer class="form-footer"><button type="button">Cancel</button><button type="button">Make Targeted Attack</button></footer>
  </form>
  <script>
    const penalties = {standard: 0, eyes: -6, head: -6, arm: -3, object: -3, torso: -1, groin: -3, leg: -3};
    const base = [5, 7, 4];
    const select = document.querySelector('[name="attackIndex"]');
    document.querySelectorAll('[name="location"]').forEach(input => input.addEventListener('change', () => {
      const penalty = penalties[document.querySelector('[name="location"]:checked').value] ?? 0;
      [...select.options].forEach((option, index) => {
        const name = option.textContent.replace(/\s*\([^)]*\)$/, '');
        const bonus = base[index] + penalty;
        option.textContent = `${name} (${bonus >= 0 ? '+' : ''}${bonus})`;
      });
    }));
  </script>
<p style="text-align:center">Static menu preview — no game rolls.</p><button type="button" id="preview-cursor" style="display:block;margin:1rem auto">Preview targeting crosshair</button><script type="module">import {startTargetCursor} from "./scripts/core/targetCursor.js"; let cleanup; document.querySelector("#preview-cursor").onclick=()=>{ if(cleanup){cleanup();cleanup=null;}else{cleanup=startTargetCursor();} }; document.addEventListener("keydown",event=>{if(event.key==="Escape"){cleanup?.();cleanup=null;}});</script></body>
</html>
